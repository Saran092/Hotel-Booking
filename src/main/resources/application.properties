spring.application.name=hotel-booking
server.port=${PORT:8080}

# ---- Database (H2 file database by default; data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/hoteldb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# ---- Web ----
spring.thymeleaf.cache=false
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---- Hotel settings (shown on invoices and used for price calculation) ----
hotel.name=Grand Residency Hotel
hotel.address=12 Marina Beach Road, Chennai, Tamil Nadu 600004
hotel.email=support@grandresidency.example
hotel.phone=+91 44 5550 1234
hotel.gst-percent=12
hotel.service-charge-percent=5

# ---- Business rules ----
hotel.max-failed-logins=5
hotel.lock-minutes=15
hotel.modification-cutoff-hours=24
hotel.free-cancellation-hours=48
hotel.partial-refund-hours=24
hotel.partial-refund-percent=50
hotel.payment-session-minutes=10
hotel.complaint-sla-days=3

# ---- Demo data (accounts and rooms) are created on first start ----
hotel.seed-demo-data=true
