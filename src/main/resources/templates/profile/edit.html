<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1>Edit Profile</h1>
  <form th:action="@{/profile/edit}" th:object="${form}" method="post" data-validate novalidate>
    <div class="grid g2">
<div class="field"><label class="req" for="fullName">Full Name</label><input type="text" th:field="*{fullName}" data-required="Full Name is required." th:data-pattern="${rx.PROFILE_NAME}" th:data-msg="${rx.MSG_NAME}"><div class="err" th:errors="*{fullName}"></div></div><div class="field"><label class="req" for="email">Email</label><input type="email" th:field="*{email}" data-required="Email is required." th:data-pattern="${rx.EMAIL}" th:data-msg="${rx.MSG_EMAIL}"><div class="err" th:errors="*{email}"></div></div>
      <div class="field"><label class="req" for="countryCode">Country Code</label>
        <select th:field="*{countryCode}"><option th:each="c : ${countryCodes}" th:value="${c.key}" th:text="${c.value}"></option></select></div>
<div class="field"><label class="req" for="mobile">Mobile Number</label><input type="text" th:field="*{mobile}" data-required="Mobile Number is required." th:data-pattern="${rx.MOBILE}" th:data-msg="${rx.MSG_MOBILE}"><div class="err" th:errors="*{mobile}"></div></div>
    </div>
<div class="field"><label class="req" for="address">Address</label><textarea th:field="*{address}" data-required="Address is required." data-pattern="^[\s\S]{10,}$" th:data-msg="${rx.MSG_ADDRESS}"></textarea><div class="err" th:errors="*{address}"></div></div>
    <div class="actions"><button type="submit" class="btn" data-enable-when-valid>Save Changes</button>
      <a class="btn secondary" th:href="@{/profile}">Cancel</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
