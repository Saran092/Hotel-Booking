<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Review Changes')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1>Review Changes</h1>
  <table class="price-table">
    <tr><td class="muted">Room</td><td th:text="${draft.roomType.label} + ' · ' + ${draft.roomNumber}"></td></tr>
    <tr><td class="muted">Check-in</td><td th:text="${#temporals.format(draft.checkIn,'dd MMM yyyy')}"></td></tr>
    <tr><td class="muted">Check-out</td><td th:text="${#temporals.format(draft.checkOut,'dd MMM yyyy')}"></td></tr>
    <tr><td class="muted">Guests</td><td th:text="${draft.adults} + ' adult(s), ' + ${draft.children} + ' child(ren)'"></td></tr>
    <tr><td th:text="${draft.nights} + ' night(s) × ' + '₹' + ${#numbers.formatDecimal(draft.nightlyRate,1,'COMMA',2,'POINT')}"></td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(draft.base,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td>GST</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(draft.gst,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td>Service charge</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(draft.service,1,'COMMA',2,'POINT')}"></td></tr>
    <tr class="total"><td>New total</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(draft.total,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td class="muted">Already paid</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(booking.amountPaid,1,'COMMA',2,'POINT')}"></td></tr>
  </table>
  <div class="alert warning" th:if="${draft.difference.signum() > 0}">Additional payment required: <strong th:text="'₹' + ${#numbers.formatDecimal(draft.difference,1,'COMMA',2,'POINT')}"></strong></div>
  <div class="alert success" th:if="${draft.difference.signum() < 0}">Your updated booking costs less. A refund of <strong th:text="'₹' + ${#numbers.formatDecimal(draft.difference.negate(),1,'COMMA',2,'POINT')}"></strong> will be processed within 3-5 business days.</div>
  <div class="alert info" th:if="${draft.difference.signum() == 0}">No change in price.</div>
  <form th:action="@{/customer/bookings/{id}/modify/confirm(id=${booking.id})}" method="post">
    <div class="actions"><button class="btn" type="submit" th:text="${draft.difference.signum() > 0 ? 'Confirm &amp; Pay' : 'Confirm Changes'}">Confirm</button>
    <a class="btn secondary" th:href="@{/customer/bookings/{id}/modify(id=${booking.id})}">Back</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
