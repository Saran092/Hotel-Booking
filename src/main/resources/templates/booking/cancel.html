<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cancel Booking')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1>Cancel Booking <span th:text="${booking.bookingRef}"></span></h1>
  <p><span th:text="${booking.room.roomType.label} + ' · ' + ${booking.room.roomNumber}"></span>,
     <span th:text="${#temporals.format(booking.checkInDate,'dd MMM yyyy')} + ' → ' + ${#temporals.format(booking.checkOutDate,'dd MMM yyyy')}"></span></p>
  <div class="alert warning" th:text="${quote.message}"></div>
  <table class="price-table">
    <tr><td class="muted">Amount paid</td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(booking.amountPaid,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td class="muted">Refund (<span th:text="${quote.refundPercent}"></span>%)</td><td class="right"><strong th:text="'₹' + ${#numbers.formatDecimal(quote.refundAmount,1,'COMMA',2,'POINT')}"></strong></td></tr>
  </table>
  <p class="muted" style="font-size:.85rem">Policy: 100% refund if canceled at least 48 hours before check-in, 50% between 24 and 48 hours, no refund within 24 hours.</p>
  <form th:action="@{/customer/bookings/{id}/cancel(id=${booking.id})}" method="post" data-confirm="Are you sure you want to cancel this booking? This cannot be undone.">
    <div class="actions"><button class="btn danger" type="submit">Confirm Cancellation</button>
    <a class="btn secondary" th:href="@{/customer/bookings/{id}(id=${booking.id})}">Keep Booking</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
