<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Search Rooms')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>Search Rooms</h1>
<div class="card">
  <form th:action="@{/customer/rooms/search}" th:object="${form}" method="get" data-validate novalidate>
    <input type="hidden" name="search" value="1">
    <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    <div class="grid g4">
<div class="field"><label class="req" for="checkIn">Check-in</label><input type="date" th:field="*{checkIn}" data-required="Check-in is required." th:min="${today}"><div class="err" th:errors="*{checkIn}"></div></div><div class="field"><label class="req" for="checkOut">Check-out</label><input type="date" th:field="*{checkOut}" data-required="Check-out is required." th:min="${today.plusDays(1)}"><div class="err" th:errors="*{checkOut}"></div></div>
      <div class="field"><label class="req" for="adults">Adults</label><input type="number" th:field="*{adults}" min="1" max="10" data-required="Adults is required."><div class="err" th:errors="*{adults}"></div></div>
      <div class="field"><label for="children">Children</label><input type="number" th:field="*{children}" min="0" max="5"><div class="err" th:errors="*{children}"></div></div>
    </div>
    <div class="grid g4">
<div class="field"><label class="req" for="roomType">Room Type</label><select th:field="*{roomType}" data-required="Room Type is required."><option value="">-- Select --</option><option th:each="o : ${roomTypes}" th:value="${o}" th:text="${o.label}"></option></select><div class="err" th:errors="*{roomType}"></div></div>
    </div>
    <div class="actions"><button type="submit" class="btn">Search</button>
      <a class="btn secondary" th:href="@{/customer/rooms/search}">Reset</a></div>
  </form>
</div>

<div th:if="${searched}">
  <div class="alert warning" th:if="${quotes.isEmpty()}">No rooms are available for the selected dates and room type. Please try different dates or another room type.</div>
  <div class="card" th:each="q : ${quotes}">
    <div class="room-card">
      <div>
        <h2><span th:text="${q.room.roomType.label}"></span> &middot; Room <span th:text="${q.room.roomNumber}"></span></h2>
        <div class="muted"><span th:text="${q.room.bedType}"></span> &middot; up to <span th:text="${q.room.maxOccupancy}"></span> guests</div>
        <div class="chips"><span th:each="a : ${q.room.amenities}" th:text="${a}"></span></div>
        <p th:if="${q.room.description}" th:text="${q.room.description}"></p>
      </div>
      <div class="right">
        <div class="muted" th:text="${q.nights} + ' night(s)'"></div>
        <div style="font-size:1.4rem;font-weight:700" th:text="'₹' + ${#numbers.formatDecimal(q.total,1,'COMMA',2,'POINT')}"></div>
        <div class="muted" style="font-size:.8rem" th:text="'incl. taxes &amp; charges · ' + '₹' + ${#numbers.formatDecimal(q.nightlyRateWithTax,1,'COMMA',2,'POINT')} + ' / night'"></div>
        <form th:action="@{/customer/booking/confirm}" method="post" style="margin-top:8px">
          <input type="hidden" name="roomId" th:value="${q.room.id}">
          <input type="hidden" name="checkIn" th:value="${q.checkIn}">
          <input type="hidden" name="checkOut" th:value="${q.checkOut}">
          <input type="hidden" name="adults" th:value="${form.adults}">
          <input type="hidden" name="children" th:value="${form.children}">
          <button class="btn" type="submit">Book Now</button>
        </form>
      </div>
    </div>
  </div>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
