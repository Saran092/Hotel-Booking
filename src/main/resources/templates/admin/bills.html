<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Billing')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>Billing <a class="btn small" style="float:right" th:href="@{/admin/bills/new}">New Bill</a></h1>
<div class="card"><form th:action="@{/admin/bills}" th:object="${filter}" method="get" novalidate><div class="filters">
<div class="field"><label>Bill ID</label><input type="text" th:field="*{billId}"><div class="err" th:errors="*{billId}"></div></div><div class="field"><label>Customer</label><input type="text" th:field="*{customer}"><div class="err" th:errors="*{customer}"></div></div><div class="field"><label>From</label><input type="date" th:field="*{dateFrom}"><div class="err" th:errors="*{dateFrom}"></div></div><div class="field"><label>To</label><input type="date" th:field="*{dateTo}"><div class="err" th:errors="*{dateTo}"></div></div><div class="field"><label>Status</label><select th:field="*{status}"><option value="">All</option><option th:each="o : ${paymentStatuses}" th:value="${o}" th:text="${o.label}"></option></select></div><div class="field"><label>Min amount</label><input type="number" th:field="*{minAmount}" step="0.01" min="0"><div class="err" th:errors="*{minAmount}"></div></div><div class="field"><label>Max amount</label><input type="number" th:field="*{maxAmount}" step="0.01" min="0"><div class="err" th:errors="*{maxAmount}"></div></div>
</div><div class="actions"><button class="btn" type="submit">Search</button><a class="btn secondary" th:href="@{/admin/bills}">Reset</a></div></form></div>
<p class="muted" th:if="${page.empty}">No bills found.</p>
<div class="table-wrap" th:unless="${page.empty}"><table><tr><th th:replace="~{fragments/layout :: sorth(${lq}, 'id', 'Bill ID')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'customer', 'Customer')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'date', 'Date')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'amount', 'Amount')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'status', 'Status')}"></th><th></th></tr>
  <tr th:each="b : ${page.items}"><td th:text="${b.billRef}"></td><td th:text="${b.customer.fullName}"></td>
    <td th:text="${#temporals.format(b.issueDate,'dd MMM yyyy')}"></td><td th:text="'₹' + ${#numbers.formatDecimal(b.totalAmount,1,'COMMA',2,'POINT')}"></td><td><span class="tag" th:classappend="${b.paymentStatus}" th:text="${b.paymentStatus.label}"></span></td>
    <td><a class="btn small secondary" th:href="@{/admin/bills/{id}(id=${b.id})}">View</a> <a class="btn small secondary" th:href="@{/admin/bills/{id}/edit(id=${b.id})}">Edit</a></td></tr></table></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${lq})}"></div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
