<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reservation')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1 th:text="${booking != null} ? 'Edit Reservation ' + ${booking.bookingRef} : 'New Reservation'"></h1>
  <form th:action="${booking != null} ? @{/admin/reservations/{id}/edit(id=${booking.id})} : @{/admin/reservations/new}" th:object="${form}" method="post" data-validate novalidate>
    <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    <div class="field" th:if="${booking == null}"><label class="req" for="customerUsername">Customer username</label><input type="text" th:field="*{customerUsername}" data-required="Customer username is required."><div class="err" th:errors="*{customerUsername}"></div></div>
    <div class="field" th:if="${booking != null}"><label>Customer</label><input type="text" th:value="${booking.customer.fullName}" disabled><input type="hidden" th:field="*{customerUsername}"></div>
    <div class="field"><label class="req" for="roomId">Room</label><select th:field="*{roomId}" data-required="Select a room."><option value="">-- Select --</option>
      <option th:each="r : ${allRooms}" th:value="${r.id}" th:text="${r.roomNumber} + ' · ' + ${r.roomType.label} + ' · ' + ${r.status.label} + ' · max ' + ${r.maxOccupancy}"></option></select><div class="err" th:errors="*{roomId}"></div></div>
    <div class="grid g2"><div class="field"><label class="req" for="checkIn">Check-in</label><input type="date" th:field="*{checkIn}" data-required="Check-in is required."><div class="err" th:errors="*{checkIn}"></div></div><div class="field"><label class="req" for="checkOut">Check-out</label><input type="date" th:field="*{checkOut}" data-required="Check-out is required."><div class="err" th:errors="*{checkOut}"></div></div><div class="field"><label class="req" for="adults">Adults</label><input type="number" th:field="*{adults}" data-required="Adults is required." min="1"><div class="err" th:errors="*{adults}"></div></div><div class="field"><label for="children">Children</label><input type="number" th:field="*{children}" min="0"><div class="err" th:errors="*{children}"></div></div></div>
    <div class="field" th:if="${booking != null}"><label for="status">Status</label><select th:field="*{status}"><option th:each="s : ${editableStatuses}" th:value="${s}" th:text="${s.label}"></option></select><div class="err" th:errors="*{status}"></div></div>
<div class="field"><label for="notes">Notes</label><textarea th:field="*{notes}" maxlength="300"></textarea><div class="err" th:errors="*{notes}"></div></div>
    <div class="actions"><button class="btn" type="submit" data-enable-when-valid>Save</button><a class="btn secondary" th:href="@{/admin/reservations}">Cancel</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
