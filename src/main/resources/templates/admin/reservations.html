<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reservations')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>Reservations <a class="btn small" style="float:right" th:href="@{/admin/reservations/new}">New Reservation</a></h1>
<div class="card"><form th:action="@{/admin/reservations}" th:object="${filter}" method="get" novalidate><div class="filters">
<div class="field"><label>Reservation ID</label><input type="text" th:field="*{reservationId}"><div class="err" th:errors="*{reservationId}"></div></div><div class="field"><label>Customer</label><input type="text" th:field="*{customer}"><div class="err" th:errors="*{customer}"></div></div><div class="field"><label>Room number</label><input type="text" th:field="*{roomNumber}"><div class="err" th:errors="*{roomNumber}"></div></div><div class="field"><label>Check-in</label><input type="date" th:field="*{checkIn}"><div class="err" th:errors="*{checkIn}"></div></div><div class="field"><label>Check-out</label><input type="date" th:field="*{checkOut}"><div class="err" th:errors="*{checkOut}"></div></div><div class="field"><label>Status</label><select th:field="*{status}"><option value="">All</option><option th:each="o : ${bookingStatuses}" th:value="${o}" th:text="${o.label}"></option></select></div><div class="field"><label>Room type</label><select th:field="*{roomType}"><option value="">All</option><option th:each="o : ${roomTypes}" th:value="${o}" th:text="${o.label}"></option></select></div><div class="field"><label>Booking date</label><input type="date" th:field="*{bookingDate}"><div class="err" th:errors="*{bookingDate}"></div></div>
</div><div class="actions"><button class="btn" type="submit">Search</button><a class="btn secondary" th:href="@{/admin/reservations}">Reset</a></div></form></div>
<p class="muted" th:if="${page.empty}">No reservations match your search.</p>
<div class="table-wrap" th:unless="${page.empty}"><table><tr><th th:replace="~{fragments/layout :: sorth(${lq}, 'id', 'Reservation')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'customer', 'Customer')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'room', 'Room')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'checkIn', 'Check-in')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'checkOut', 'Check-out')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'status', 'Status')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'total', 'Total')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'booked', 'Booked on')}"></th><th></th></tr>
  <tr th:each="b : ${page.items}">
    <td><span th:text="${b.bookingRef}"></span> <span class="muted" th:text="'#' + ${b.id}"></span></td>
    <td th:text="${b.customer.fullName}"></td><td th:text="${b.room.roomNumber} + ' (' + ${b.room.roomType.label} + ')'"></td>
    <td th:text="${#temporals.format(b.checkInDate,'dd MMM yyyy')}"></td><td th:text="${#temporals.format(b.checkOutDate,'dd MMM yyyy')}"></td>
    <td><span class="tag" th:classappend="${b.effectiveStatus}" th:text="${b.effectiveStatus.label}"></span></td><td th:text="'₹' + ${#numbers.formatDecimal(b.totalAmount,1,'COMMA',2,'POINT')}"></td><td th:text="${#temporals.format(b.createdAt,'dd MMM yyyy')}"></td>
    <td style="white-space:nowrap">
      <a class="btn small secondary" th:if="${b.status.name() != 'CANCELLED'}" th:href="@{/admin/reservations/{id}/edit(id=${b.id})}">Edit</a>
      <form th:if="${b.status.name() == 'CONFIRMED' or b.status.name() == 'PENDING_PAYMENT'}" th:action="@{/admin/reservations/{id}/cancel(id=${b.id})}" method="post" style="display:inline" data-confirm="Cancel this reservation? The customer will be refunded in full."><button class="btn small danger" type="submit">Cancel</button></form></td>
  </tr></table></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${lq})}"></div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
