<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Rooms')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>Rooms <span style="float:right"><a class="btn small" th:href="@{/admin/rooms/new}">Add Room</a> <a class="btn small secondary" th:href="@{/admin/rooms/bulk}">Bulk Upload</a></span></h1>
<div class="card"><form th:action="@{/admin/rooms}" th:object="${filter}" method="get" novalidate>
  <div class="filters">
<div class="field"><label>Search (number / type)</label><input type="text" th:field="*{q}"><div class="err" th:errors="*{q}"></div></div><div class="field"><label>Room type</label><select th:field="*{roomType}"><option value="">All</option><option th:each="o : ${roomTypes}" th:value="${o}" th:text="${o.label}"></option></select></div><div class="field"><label>Min price</label><input type="number" th:field="*{minPrice}" step="0.01" min="0"><div class="err" th:errors="*{minPrice}"></div></div><div class="field"><label>Max price</label><input type="number" th:field="*{maxPrice}" step="0.01" min="0"><div class="err" th:errors="*{maxPrice}"></div></div>
    <div class="field"><label>Availability</label><select th:field="*{availability}"><option value="">All</option><option value="AVAILABLE">Available</option><option value="UNAVAILABLE">Not available</option></select></div>
    <div class="field"><label>Amenity</label><select th:field="*{amenity}"><option value="">Any</option><option th:each="a : ${amenityList}" th:value="${a}" th:text="${a}"></option></select></div>
<div class="field"><label>Min. occupancy</label><input type="number" th:field="*{maxOccupancy}" min="1"><div class="err" th:errors="*{maxOccupancy}"></div></div><div class="field"><label>Available on</label><input type="date" th:field="*{date}"><div class="err" th:errors="*{date}"></div></div>
  </div>
  <div class="actions"><button class="btn" type="submit">Search</button><a class="btn secondary" th:href="@{/admin/rooms}">Reset</a></div>
</form></div>
<p class="muted" th:if="${page.empty}">No rooms match your search.</p>
<div class="table-wrap" th:unless="${page.empty}"><table><tr><th th:replace="~{fragments/layout :: sorth(${lq}, 'roomNumber', 'Room')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'roomType', 'Type')}"></th><th>Bed</th><th th:replace="~{fragments/layout :: sorth(${lq}, 'price', 'Price / night')}"></th><th th:replace="~{fragments/layout :: sorth(${lq}, 'occupancy', 'Max guests')}"></th><th>Amenities</th><th th:replace="~{fragments/layout :: sorth(${lq}, 'status', 'Status')}"></th><th>Free today</th><th></th></tr>
  <tr th:each="r : ${page.items}">
    <td th:text="${r.roomNumber}"></td><td th:text="${r.roomType.label}"></td><td th:text="${r.bedType}"></td>
    <td th:text="'₹' + ${#numbers.formatDecimal(r.pricePerNight,1,'COMMA',2,'POINT')}"></td><td th:text="${r.maxOccupancy}"></td>
    <td class="chips"><span th:each="a : ${r.amenities}" th:text="${a}"></span></td>
    <td><span class="tag" th:classappend="${r.status}" th:text="${r.status.label}"></span></td>
    <td th:text="${availableNow[r.id] ? 'Yes' : 'No'}"></td>
    <td style="white-space:nowrap"><a class="btn small secondary" th:href="@{/admin/rooms/{id}/edit(id=${r.id})}">Edit</a>
      <form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" style="display:inline" data-confirm="Delete this room permanently?"><button class="btn small danger" type="submit">Delete</button></form></td>
  </tr></table></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${lq})}"></div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
