<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Bill')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1>Bill <span th:text="${bill.billRef}"></span> <span class="tag" th:classappend="${bill.paymentStatus}" th:text="${bill.paymentStatus.label}"></span></h1>
  <p>Customer: <strong th:text="${bill.customer.fullName}"></strong> · Issued <span th:text="${#temporals.format(bill.issueDate,'dd MMM yyyy HH:mm')}"></span>
     <span th:if="${bill.booking != null}"> · Booking <span th:text="${bill.booking.bookingRef}"></span></span></p>
  <div class="table-wrap"><table><tr><th>Category</th><th>Description</th><th>Date / time</th><th>Qty</th><th>Unit price</th><th>Tax %</th><th>Discount</th><th class="right">Line total</th></tr>
    <tr th:each="i : ${bill.items}"><td th:text="${i.category.label}"></td><td th:text="${i.description}"></td>
      <td th:text="${i.serviceDateTime != null} ? ${#temporals.format(i.serviceDateTime,'dd MMM yyyy HH:mm')} : '-'"></td><td th:text="${i.quantity}"></td>
      <td th:text="'₹' + ${#numbers.formatDecimal(i.unitPrice,1,'COMMA',2,'POINT')}"></td><td th:text="${i.taxPercent}"></td><td th:text="'₹' + ${#numbers.formatDecimal(i.discount,1,'COMMA',2,'POINT')}"></td><td class="right" th:text="'₹' + ${#numbers.formatDecimal(i.lineTotal,1,'COMMA',2,'POINT')}"></td></tr>
    <tr><td colspan="7" class="right"><strong>Total</strong></td><td class="right"><strong th:text="'₹' + ${#numbers.formatDecimal(bill.totalAmount,1,'COMMA',2,'POINT')}"></strong></td></tr></table></div>
  <p th:if="${bill.notes}" th:text="'Notes: ' + ${bill.notes}"></p>
  <div class="actions"><a class="btn" th:href="@{/admin/bills/{id}/edit(id=${bill.id})}">Edit</a><a class="btn secondary" th:href="@{/admin/bills}">Back</a></div>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
