<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Room')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="medium card">
  <h1>Edit Room <span th:text="${room.roomNumber}"></span></h1>
  <div class="alert warning" th:if="${blocked}" th:text="${blocked}"></div>
  <form th:action="@{/admin/rooms/{id}/edit(id=${room.id})}" th:object="${form}" method="post" data-validate novalidate data-confirm="Are you sure you want to update this room?">
    <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div><fieldset th:disabled="${blocked != null}" style="border:0;padding:0;margin:0"><div class="field"><label class="req" for="roomNumber">Room number</label><input type="text" th:field="*{roomNumber}" data-required="Room number is required." maxlength="10"><div class="err" th:errors="*{roomNumber}"></div></div>
<div class="grid g2"><div class="field"><label class="req" for="roomType">Room type</label><select th:field="*{roomType}" data-required="Room type is required."><option value="">-- Select --</option><option th:each="o : ${roomTypes}" th:value="${o}" th:text="${o.label}"></option></select><div class="err" th:errors="*{roomType}"></div></div><div class="field"><label class="req" for="bedType">Bed type</label><select th:field="*{bedType}" data-required="Bed type is required."><option value="">-- Select --</option><option th:each="b : ${bedTypes}" th:value="${b}" th:text="${b}"></option></select><div class="err" th:errors="*{bedType}"></div></div><div class="field"><label class="req" for="pricePerNight">Price per night (₹)</label><input type="number" th:field="*{pricePerNight}" data-required="Price per night (₹) is required." step="0.01" min="0.01"><div class="err" th:errors="*{pricePerNight}"></div></div><div class="field"><label class="req" for="maxOccupancy">Max occupancy</label><input type="number" th:field="*{maxOccupancy}" data-required="Max occupancy is required." min="1" max="10"><div class="err" th:errors="*{maxOccupancy}"></div></div><div class="field"><label class="req" for="status">Status</label><select th:field="*{status}" data-required="Status is required."><option value="">-- Select --</option><option th:each="o : ${roomStatuses}" th:value="${o}" th:text="${o.label}"></option></select><div class="err" th:errors="*{status}"></div></div></div>
<div class="field"><label>Amenities</label><div class="checks"><label th:each="a : ${amenityList}"><input type="checkbox" th:field="*{amenities}" th:value="${a}"><span th:text="${a}"></span></label></div><div class="err" th:errors="*{amenities}"></div></div>
<div class="field"><label for="description">Description</label><textarea th:field="*{description}" maxlength="500"></textarea><div class="err" th:errors="*{description}"></div></div></fieldset>
    <div class="actions"><button class="btn" type="submit" th:disabled="${blocked != null}">Save Changes</button>
      <a class="btn secondary" th:href="@{/admin/rooms}">Back</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
