<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Complaints')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>My Complaints <a class="btn small" style="float:right" th:href="@{/customer/complaints/new}">Raise a Complaint</a></h1>
<div class="card">
  <p class="muted" th:if="${complaints.isEmpty()}">You have not raised any complaints.</p>
  <div class="table-wrap" th:unless="${complaints.isEmpty()}"><table>
    <tr><th>Complaint ID</th><th>Date</th><th>Category</th><th>Title</th><th>Status</th><th>Expected resolution</th><th></th></tr>
    <tr th:each="c : ${complaints}">
      <td th:text="${c.reference}"></td>
      <td th:text="${#temporals.format(c.submittedAt,'dd MMM yyyy')}"></td>
      <td th:text="${c.category.label}"></td>
      <td th:text="${c.title}"></td>
      <td><span class="tag" th:classappend="${c.status}" th:text="${c.status.label}"></span></td>
      <td th:text="${c.expectedResolutionDate != null} ? ${#temporals.format(c.expectedResolutionDate,'dd MMM yyyy')} : '-'"></td>
      <td><a class="btn small secondary" th:href="@{/customer/complaints/{id}(id=${c.id})}">View</a></td>
    </tr>
  </table></div>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
