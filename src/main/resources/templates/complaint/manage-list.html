<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Complaints')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1 th:text="${admin ? 'Complaint Management' : 'My Assigned Complaints'}"></h1>
<div class="card">
  <form th:action="@{${base}}" th:object="${filter}" method="get" data-validate novalidate>
    <div class="filters">
      <div class="field"><label>From</label><input type="date" th:field="*{dateFrom}"></div>
      <div class="field"><label>To</label><input type="date" th:field="*{dateTo}"></div>
      <div class="field"><label>Category</label><select th:field="*{category}"><option value="">All</option><option th:each="o : ${complaintCategories}" th:value="${o}" th:text="${o.label}"></option></select></div>
      <div class="field"><label>Status</label><select th:field="*{status}"><option value="">All</option><option th:each="o : ${complaintStatuses}" th:value="${o}" th:text="${o.label}"></option></select></div>
      <div class="field"><label>Customer</label><input type="text" th:field="*{customer}"><div class="err" th:errors="*{customer}"></div></div>
      <div class="field" th:if="${admin}"><label>Assigned to</label><select th:field="*{assignedTo}"><option value="">All</option><option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.fullName}"></option></select></div>
    </div>
    <div class="actions"><button class="btn" type="submit">Search</button><a class="btn secondary" th:href="@{${base}}">Reset</a></div>
  </form>
</div>
<p class="muted" th:if="${page.empty}">No complaints match your criteria.</p>
<div class="table-wrap" th:unless="${page.empty}"><table>
  <tr>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'id', 'Complaint ID')}"></th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'customer', 'Customer')}"></th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'date', 'Date')}"></th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'category', 'Category')}"></th>
    <th>Title</th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'priority', 'Priority')}"></th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'status', 'Status')}"></th>
    <th th:replace="~{fragments/layout :: sorth(${lq}, 'staff', 'Assigned To')}"></th><th></th>
  </tr>
  <tr th:each="c : ${page.items}">
    <td th:text="${c.reference}"></td><td th:text="${c.customer.fullName}"></td>
    <td th:text="${#temporals.format(c.submittedAt,'dd MMM yyyy')}"></td><td th:text="${c.category.label}"></td><td th:text="${c.title}"></td>
    <td><span class="tag" th:classappend="${c.priority}" th:text="${c.priority.label}"></span></td><td><span class="tag" th:classappend="${c.status}" th:text="${c.status.label}"></span></td>
    <td th:text="${c.assignedTo != null} ? ${c.assignedTo.fullName} : '-'"></td>
    <td><a class="btn small secondary" th:href="@{|${base}/${c.id}|}">Open</a></td>
  </tr>
</table></div>
<div th:replace="~{fragments/layout :: pager(${page}, ${lq})}"></div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
