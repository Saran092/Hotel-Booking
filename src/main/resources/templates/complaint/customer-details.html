<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Complaint Details')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<h1>Complaint <span th:text="${complaint.reference}"></span> <span class="tag" th:classappend="${complaint.status}" th:text="${complaint.status.label}"></span></h1>
<div class="grid g2">
 <div class="card"><h2 th:text="${complaint.title}"></h2>
  <table class="price-table">
    <tr><td class="muted" style="width:160px">Category</td><td th:text="${complaint.category.label}"></td></tr>
    <tr><td class="muted">Submitted</td><td th:text="${#temporals.format(complaint.submittedAt,'dd MMM yyyy HH:mm')}"></td></tr>
    <tr><td class="muted">Related booking</td><td th:text="${complaint.booking != null} ? ${complaint.booking.bookingRef} : '-'"></td></tr>
    <tr><td class="muted">Contact via</td><td th:text="${complaint.contactPreference.label}"></td></tr>
    <tr><td class="muted">Priority</td><td th:text="${complaint.priority.label}"></td></tr>
    <tr><td class="muted">Assigned to</td><td th:text="${complaint.assignedTo != null} ? ${complaint.assignedTo.fullName} : 'Awaiting assignment'"></td></tr>
    <tr><td class="muted">Expected resolution</td><td th:text="${complaint.expectedResolutionDate != null} ? ${#temporals.format(complaint.expectedResolutionDate,'dd MMM yyyy')} : '-'"></td></tr>
  </table>
  <p style="white-space:pre-wrap" th:text="${complaint.description}"></p>
 </div>
 <div class="card"><h2>Hotel Response</h2>
  <p class="muted" th:if="${complaint.supportResponse == null and complaint.resolutionNotes == null}">No response yet. We will get back to you soon.</p>
  <p th:if="${complaint.supportResponse}" style="white-space:pre-wrap" th:text="${complaint.supportResponse}"></p>
  <div th:if="${complaint.resolutionNotes}"><strong>Resolution:</strong><p style="white-space:pre-wrap" th:text="${complaint.resolutionNotes}"></p></div>
  <div class="alert info" th:if="${complaint.status.name() == 'RESOLVED'}">The hotel has marked this complaint as resolved. Please confirm or reopen it.</div>
  <div class="actions">
    <a class="btn" th:if="${complaint.status.name() == 'OPEN'}" th:href="@{/customer/complaints/{id}/edit(id=${complaint.id})}">Edit</a>
    <form th:if="${complaint.status.name() == 'RESOLVED'}" th:action="@{/customer/complaints/{id}/confirm(id=${complaint.id})}" method="post"><button class="btn ok" type="submit">Confirm Resolution</button></form>
    <form th:if="${complaint.status.name() == 'RESOLVED'}" th:action="@{/customer/complaints/{id}/reopen(id=${complaint.id})}" method="post"><button class="btn danger" type="submit">Reopen</button></form>
  </div>
 </div>
</div>
<div class="card"><h2>Progress</h2>
  <div class="timeline">
    <div class="item" th:each="a : ${complaint.actions}" th:if="${a.visibleToCustomer}">
      <strong th:text="${a.type.label}"></strong> <span class="muted" th:text="'· ' + ${#temporals.format(a.createdAt,'dd MMM yyyy HH:mm')}"></span>
      <div style="white-space:pre-wrap" th:text="${a.details}"></div>
    </div>
  </div>
  <p class="muted" th:if="${#lists.isEmpty(complaint.actions)}">No updates yet.</p>
</div>
<a class="btn secondary" th:href="@{/customer/complaints}">Back</a>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
