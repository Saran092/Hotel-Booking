<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="narrow card">
  <h1>Change Password</h1>
  <div class="alert warning" th:if="${forced}">For security you must set a new password before continuing.</div>
  <form th:action="@{/change-password}" th:object="${form}" method="post" data-validate novalidate>
<div class="field"><label class="req" for="newPassword">New Password</label><input type="password" th:field="*{newPassword}" data-required="New Password is required." th:data-pattern="${rx.PASSWORD}" th:data-msg="${rx.MSG_PASSWORD}"><div class="err" th:errors="*{newPassword}"></div></div><div class="field"><label class="req" for="confirmPassword">Confirm Password</label><input type="password" th:field="*{confirmPassword}" data-required="Confirm Password is required." data-match="newPassword" data-msg="Passwords do not match."><div class="err" th:errors="*{confirmPassword}"></div></div>
    <div class="actions"><button type="submit" class="btn" data-enable-when-valid disabled>Change Password</button></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
