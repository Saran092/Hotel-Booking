<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="narrow card">
  <h1>Reset Password</h1>
  <p class="muted">Enter your username and registered email to set a new password.</p>
  <form th:action="@{/forgot-password}" th:object="${form}" method="post" data-validate novalidate>
  <div class="alert error" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
<div class="field"><label class="req" for="username">Username</label><input type="text" th:field="*{username}" data-required="Username is required."><div class="err" th:errors="*{username}"></div></div><div class="field"><label class="req" for="email">Registered Email</label><input type="email" th:field="*{email}" data-required="Registered Email is required." th:data-pattern="${rx.EMAIL}" th:data-msg="${rx.MSG_EMAIL}"><div class="err" th:errors="*{email}"></div></div><div class="field"><label class="req" for="newPassword">New Password</label><input type="password" th:field="*{newPassword}" data-required="New Password is required." th:data-pattern="${rx.PASSWORD}" th:data-msg="${rx.MSG_PASSWORD}"><div class="err" th:errors="*{newPassword}"></div></div><div class="field"><label class="req" for="confirmPassword">Confirm Password</label><input type="password" th:field="*{confirmPassword}" data-required="Confirm Password is required." data-match="newPassword" data-msg="Passwords do not match."><div class="err" th:errors="*{confirmPassword}"></div></div>
    <div class="actions"><button type="submit" class="btn" data-enable-when-valid disabled>Reset Password</button>
      <a class="btn secondary" th:href="@{/login}">Cancel</a></div>
  </form>
</div>
</main>
<footer th:replace="~{fragments/layout :: foot}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
