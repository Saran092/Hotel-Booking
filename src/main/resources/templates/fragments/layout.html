<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ' + ${hotel.name}">Hotel</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="top" th:fragment="nav">
    <div class="bar">
        <a class="logo" th:href="@{/}" th:text="${hotel.name}">Hotel</a>
        <nav sec:authorize="hasRole('CUSTOMER')">
            <a th:href="@{/customer/home}">Home</a>
            <a th:href="@{/customer/rooms/search}">Book a Room</a>
            <a th:href="@{/customer/bookings}">My Bookings</a>
            <a th:href="@{/customer/complaints}">Complaints</a>
        </nav>
        <nav sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/home}">Dashboard</a>
            <a th:href="@{/admin/rooms}">Rooms</a>
            <a th:href="@{/admin/reservations}">Reservations</a>
            <a th:href="@{/admin/bills}">Billing</a>
            <a th:href="@{/admin/complaints}">Complaints</a>
            <a th:href="@{/admin/users}">Users</a>
            <a th:href="@{/admin/reports}">Reports</a>
        </nav>
        <nav sec:authorize="hasRole('STAFF') and !hasRole('ADMIN')">
            <a th:href="@{/staff/complaints}">Assigned Complaints</a>
        </nav>
        <div class="who" sec:authorize="isAuthenticated()">
            <a th:href="@{/notifications}">Notifications<span class="badge-n" th:if="${unreadCount > 0}" th:text="${unreadCount}">0</span></a>
            <a th:href="@{/profile}" th:text="${me != null ? me.fullName : 'Profile'}">Profile</a>
            <form th:action="@{/logout}" method="post"><button class="btn small secondary" type="submit">Logout</button></form>
        </div>
    </div>
</header>

<div th:fragment="flash">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="alert warning" th:if="${warning}" th:text="${warning}"></div>
    <div class="alert info" th:if="${info}" th:text="${info}"></div>
</div>

<footer class="foot" th:fragment="foot">
    <span th:text="${hotel.name} + ' · ' + ${hotel.address} + ' · ' + ${hotel.phone}">Hotel</span>
</footer>

<th:block th:fragment="scripts"><script th:src="@{/js/app.js}"></script></th:block>

<!-- Pager: usage  th:replace="~{fragments/layout :: pager(${page}, ${lq})}" -->
<nav class="pager" th:fragment="pager(page, lq)" th:if="${page != null and page.totalPages > 1}">
    <a th:if="${page.hasPrevious}" th:href="${lq.pageUrl(page.page - 1)}">‹ Prev</a>
    <span class="off" th:unless="${page.hasPrevious}">‹ Prev</span>
    <th:block th:each="p : ${#numbers.sequence(1, page.totalPages)}">
        <span class="cur" th:if="${p == page.page}" th:text="${p}">1</span>
        <a th:unless="${p == page.page}" th:href="${lq.pageUrl(p)}" th:text="${p}">2</a>
    </th:block>
    <a th:if="${page.hasNext}" th:href="${lq.pageUrl(page.page + 1)}">Next ›</a>
    <span class="off" th:unless="${page.hasNext}">Next ›</span>
    <span class="muted" th:text="${page.totalElements} + ' records'"></span>
</nav>

<!-- Sortable column header: usage th:replace="~{fragments/layout :: sorth(${lq}, 'status', 'Status')}" -->
<th th:fragment="sorth(lq, key, label)"><a th:href="${lq.sortUrl(key)}" th:text="${label} + ${lq.indicator(key)}">Col</a></th>

<!-- Simple status tag -->
<span th:fragment="tag(value, label)" class="tag" th:classappend="${value}" th:text="${label}"></span>

</body>
</html>
